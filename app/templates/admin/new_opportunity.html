{% extends "base.html" %}
{% block content %}
<h2>Ajouter une opportunité</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>Titre</label><input type="text" name="title" required></p>
    <p><label>Description</label><textarea name="description" required></textarea></p>
    <p><label>Organisateur</label><input type="text" name="organizer"></p>
    <p><label>Lien</label><input type="url" name="link" required></p>
    <p><label>Zone</label><input type="text" name="country_scope" placeholder="Bénin, Afrique, International..."></p>
    <p><label>Catégorie</label>
        <select name="category_id">
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </p>
    <button type="submit">Ajouter</button>
</form>
{% endblock %}
